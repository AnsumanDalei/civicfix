{% comment %}
Self-hosted line-icon set (no external font/CDN needed — renders even offline).
Usage: {% include "partials/icon.html" with name="phone" %}
Stroke-based, 24x24 grid, consistent 1.8 stroke — matches the CivicFix mark style.
{% endcomment %}
<svg class="icon icon-{{ name }}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == "grid" %}<rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>
{% elif name == "list-check" %}<line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><polyline points="3,6 4.2,7.2 6.5,4.6"/><polyline points="3,12 4.2,13.2 6.5,10.6"/><polyline points="3,18 4.2,19.2 6.5,16.6"/>
{% elif name == "plus-circle" %}<circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
{% elif name == "chart" %}<line x1="4" y1="20" x2="21" y2="20"/><rect x="6" y="13" width="3.2" height="7"/><rect x="11.4" y="9" width="3.2" height="11"/><rect x="16.8" y="5" width="3.2" height="15"/>
{% elif name == "bell" %}<path d="M6.5 10a5.5 5.5 0 0 1 11 0c0 4.5 1.8 5.5 1.8 5.5H4.7S6.5 14.5 6.5 10z"/><path d="M10.2 19a1.9 1.9 0 0 0 3.6 0"/>
{% elif name == "user" %}<circle cx="12" cy="8.2" r="3.7"/><path d="M4.5 20c0-4.2 3.3-6.7 7.5-6.7s7.5 2.5 7.5 6.7"/>
{% elif name == "lock" %}<rect x="5.2" y="11" width="13.6" height="9" rx="2"/><path d="M8.2 11V8a3.8 3.8 0 0 1 7.6 0v3"/>
{% elif name == "question-circle" %}<circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.8 2.8 0 1 1 4 2.5c-.9.5-1.3 1-1.3 2.1"/><circle cx="12" cy="17" r="0.15" fill="currentColor" stroke="none"/>
{% elif name == "logout" %}<path d="M9.5 4H6.3A2.3 2.3 0 0 0 4 6.3v11.4A2.3 2.3 0 0 0 6.3 20H9.5"/><line x1="20.5" y1="12" x2="10.2" y2="12"/><polyline points="16,7.5 20.5,12 16,16.5"/>
{% elif name == "gear" %}<circle cx="12" cy="12" r="3"/><path d="M12 3.2v2.3M12 18.5v2.3M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M3.2 12h2.3M18.5 12h2.3M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>
{% elif name == "chevron-down" %}<polyline points="5,8.5 12,15.5 19,8.5"/>
{% elif name == "bars" %}<line x1="3.5" y1="6.5" x2="20.5" y2="6.5"/><line x1="3.5" y1="12" x2="20.5" y2="12"/><line x1="3.5" y1="17.5" x2="20.5" y2="17.5"/>
{% elif name == "envelope" %}<rect x="3" y="5.5" width="18" height="13" rx="1.8"/><polyline points="3.5,6.5 12,13 20.5,6.5"/>
{% elif name == "phone" %}<path d="M5.2 4.2h2.8l1.6 4-2.2 1.4a11 11 0 0 0 5 5l1.4-2.2 4 1.6v2.8a1.6 1.6 0 0 1-1.7 1.6C10 18 6 14 5.4 7.9a1.6 1.6 0 0 1 1.6-1.7z"/>
{% elif name == "calendar" %}<rect x="3.2" y="5" width="17.6" height="15.5" rx="1.8"/><line x1="3.2" y1="9.6" x2="20.8" y2="9.6"/><line x1="8" y1="3" x2="8" y2="6.6"/><line x1="16" y1="3" x2="16" y2="6.6"/>
{% elif name == "warning" %}<path d="M12 3.5L2.5 20h19L12 3.5z"/><line x1="12" y1="9.5" x2="12" y2="14.2"/><circle cx="12" cy="17" r="0.15" fill="currentColor" stroke="none"/>
{% elif name == "check-circle" %}<circle cx="12" cy="12" r="9"/><polyline points="7.8,12.3 10.6,15.2 16.3,8.8"/>
{% elif name == "clock" %}<circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12.2 15.8,14.3"/>
{% elif name == "file-lines" %}<path d="M7.2 3.2h6.5l4 4v13a1 1 0 0 1-1 1H7.2a1 1 0 0 1-1-1V4.2a1 1 0 0 1 1-1z"/><line x1="9" y1="12.5" x2="15.5" y2="12.5"/><line x1="9" y1="16" x2="15.5" y2="16"/>
{% elif name == "location-pin" %}<path d="M12 21s6.5-6 6.5-11.5A6.5 6.5 0 0 0 5.5 9.5C5.5 15 12 21 12 21z"/><circle cx="12" cy="9.4" r="2.3"/>
{% elif name == "thumbs-up" %}<path d="M7.3 11.2V20H4.5v-8.8h2.8z"/><path d="M7.3 11.2l3.6-7.4a2 2 0 0 1 2 2v3.7h5a2 2 0 0 1 2 2.3l-1 4.9a2 2 0 0 1-2 1.6H7.3"/>
{% elif name == "pencil" %}<path d="M4.5 16.2V19.5h3.3L18 9.3l-3.3-3.3L4.5 16.2z"/><line x1="13.2" y1="6.5" x2="16.5" y2="9.8"/>
{% elif name == "trash" %}<line x1="4.5" y1="7" x2="19.5" y2="7"/><path d="M9 7V4.6h6V7"/><path d="M6.3 7l1 12.4h9.4l1-12.4"/>
{% elif name == "moon" %}<path d="M19.5 14.3A8.2 8.2 0 1 1 9.7 4.5a6.7 6.7 0 0 0 9.8 9.8z"/>
{% elif name == "globe" %}<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3.2c2.3 2.4 3.3 5.7 3.3 8.8s-1 6.4-3.3 8.8c-2.3-2.4-3.3-5.7-3.3-8.8s1-6.4 3.3-8.8z"/>
{% elif name == "history" %}<path d="M4.3 12a7.7 7.7 0 1 0 2.3-5.5"/><polyline points="4,4.3 4,8.7 8.4,8.7"/><polyline points="12,8 12,12.3 15.5,14.3"/>
{% elif name == "search" %}<circle cx="10.3" cy="10.3" r="6"/><line x1="14.8" y1="14.8" x2="20" y2="20"/>
{% elif name == "arrow-left" %}<line x1="20.5" y1="12" x2="4" y2="12"/><polyline points="10,6 4,12 10,18"/>
{% elif name == "paper-plane" %}<polygon points="3.2,11.2 20.8,3.2 12.8,20.8 10.8,12.8 3.2,11.2"/>
{% elif name == "toolbox" %}<rect x="3" y="9.2" width="18" height="10.3" rx="1.6"/><path d="M8.2 9.2V6.5a1.8 1.8 0 0 1 1.8-1.8h4a1.8 1.8 0 0 1 1.8 1.8v2.7"/><line x1="3" y1="13.6" x2="21" y2="13.6"/>
{% elif name == "users" %}<circle cx="9" cy="8.3" r="3"/><path d="M3.3 20c0-3.5 2.6-5.6 5.7-5.6s5.7 2.1 5.7 5.6"/><circle cx="17" cy="9.2" r="2.3"/><path d="M15.6 14.3c2.4.4 4.1 2.2 4.1 5.7"/>
{% elif name == "shield" %}<path d="M12 3.2l6.8 2.6v5c0 5-2.9 7.9-6.8 9.4-3.9-1.5-6.8-4.4-6.8-9.4v-5L12 3.2z"/>
{% elif name == "flame" %}<path d="M12 2.2c2 2.8 4.6 5.8 4.6 9.3a4.6 4.6 0 0 1-9.2 0c0-1.3.4-2.3 1-3.2.3 1.3 1.1 1.8 1.6.9.5-.9-.4-1.8-.4-3.2C9.6 4 10.7 3 12 2.2z"/>
{% elif name == "heart" %}<path d="M12 20s-6.5-4-6.5-9a3.9 3.9 0 0 1 6.5-2.9A3.9 3.9 0 0 1 18.5 11c0 5-6.5 9-6.5 9z"/>
{% elif name == "check" %}<polyline points="4.5,12.5 9.5,17.5 19.5,6.5"/>
{% endif %}
</svg>
